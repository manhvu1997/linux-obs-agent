[defaults]
# Ansible configuration for obs-agent deployment

# Inventory files
inventory = ./inventory/hosts
inventory_plugins = ./plugins/inventory
roles_path = ./roles:~/.ansible/roles:/usr/share/ansible/roles:/usr/lib/ansible/roles

# Connection settings
host_key_checking = True
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
timeout = 30
deprecation_warnings = True

# Display and output options
force_color = True
inventory_ignore_extensions = .swp, .bak, .tmp, ~, .orig, .ini, .cfg, .yml~
display_skipped_hosts = False
display_ok_hosts = True

# Parallelism
forks = 5

# Facts and gathering
gathering = smart
gather_subset = !all,!fips

# Variables
vars_plugins_enabled = host_group_vars,community.general.varnames
group_vars_files = group_vars/default.yml

# Retry and undo
retry_files_enabled = False
retry_files_save_path = ./.ansible-retry

# Task execution
task_display = default
action_plugins = ./plugins/action

# Local connection
local_tmp = ~/.ansible/local
system_tmpdirs = ['/var/tmp', '/tmp']

# Logging
#log_path = ./ansible.log
#stdout_callback = json

# Become settings (sudo)
become = False
become_method = sudo
become_user = root
become_ask_pass = False

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
# pipelining = True
# control_path = /tmp/ansible-ssh-%%h-%%p-%%r
