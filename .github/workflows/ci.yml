name: CI

# lint → test+build (linux/amd64) → publish
#   * every push to main / pull request : lint, test, build, and a dry-run image build
#   * push to main                      : also pushes ghcr.io/<owner>/<repo>:{main,sha-<short>,latest}
#   * tag v*                            : pushes :<version>, :<major>.<minor>, :latest and
#                                         attaches obs-agent_<version>_linux_amd64.tar.gz to a GitHub Release
#   * workflow_dispatch                 : optional job that runs the eBPF integration tests with sudo
#                                         (the only place real kernel behaviour is exercised)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      ebpf_integration:
        description: Run the eBPF integration tests (sudo, real kernel) on the runner
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # golangci-lint type-checks the packages that import the bpf2go output.
      - uses: ./.github/actions/ebpf-generate
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0

  build:
    name: Test & build (linux/amd64)
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: ./.github/actions/ebpf-generate

      - name: Version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-${GITHUB_SHA::7}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Test
        run: go test -race ./...

      - name: Build static binary
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" -o dist/obs-agent ./cmd/agent
          file dist/obs-agent
          ls -lh dist/obs-agent

      - name: Package
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          NAME="obs-agent_${VERSION}_linux_amd64"
          mkdir -p "dist/$NAME" dist/image
          install -m 0755 dist/obs-agent "dist/$NAME/obs-agent"
          cp deploy/config.yaml.example deploy/obs-agent.service "dist/$NAME/"
          tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"
          (cd dist && sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256")
          # Build context for the image job (see deploy/Dockerfile.release).
          install -m 0755 dist/obs-agent dist/image/obs-agent
          cp deploy/config.yaml.example dist/image/config.yaml.example

      - uses: actions/upload-artifact@v4
        with:
          name: obs-agent-linux-amd64
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: image-context
          path: dist/image
          if-no-files-found: error

  image:
    name: Container image (ghcr.io)
    needs: [lint, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: image-context
          path: image-context
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push (amd64)
        uses: docker/build-push-action@v6
        with:
          context: image-context
          file: deploy/Dockerfile.release
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false

  release:
    name: GitHub Release (binary download)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: obs-agent-linux-amd64
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true

  ebpf-integration:
    name: eBPF integration tests (manual, sudo)
    if: github.event_name == 'workflow_dispatch' && inputs.ebpf_integration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: ./.github/actions/ebpf-generate
      - name: Build test binaries
        run: |
          go test -c -tags ebpf_integration -o /tmp/netflow.test ./internal/ebpf/netflow/
      - name: Run netflow integration tests as root
        run: sudo /tmp/netflow.test -test.v
